services:
  - type: web
    name: glomopay-mcp
    runtime: node
    plan: starter
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    # Deploy a commit on main only after its GitHub checks pass (the CI workflow's build-and-test job runs on every push to main).
    autoDeployTrigger: checksPass
    envVars:
      # Required: the app defaults to 127.0.0.1; Render only routes to 0.0.0.0.
      - key: HOST
        value: 0.0.0.0
      # Pin the Node version (kept in sync with .nvmrc; >= 22.12 for the vite/vitest toolchain).
      - key: NODE_VERSION
        value: 22.12.0
      # Downstream Glomo base host (no /api/v1 — the server appends it).
      # Set the value in the Render dashboard, not in git.
      - key: API_HOST
        sync: false
      # How many proxies to trust for the client address (see README.md). The app refuses to start on
      # Render without it. Verify it on every hostname with CLIENT_IP_DIAGNOSTIC=1 (README.md, Deployment).
      - key: TRUST_PROXY_HOPS
        value: '3'
    # The health check path (GET /healthz) is set in a follow-up change, once a deploy serving it is live:
    # setting it in the same change could health-check the running instance before it serves the route.
